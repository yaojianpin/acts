
[workspace]
members = [
    "crates/*",
    "packages/*",
    "plugins/*",
    "examples/plugins/*",
    "examples/packages/*",
]
resolver = "3"

[workspace.package]
authors = ["Yao <yaojianpin@sohu.com>"]
description = "a fast, lightweight, extensiable workflow engine"
keywords = ["workflow"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/yaojianpin/acts.git"
# The floor every crate promises, declared once: members inherit it with
# `rust-version.workspace = true`, so a downstream `cargo` reads the same number
# from each crate it installs, and `.github/workflows/rust.yml` builds this same
# version in a leg beside `stable`.
#
# 1.88 is what the dependency graph already requires — `async-nats` 0.50,
# `tonic` 0.14, `redis` 1.7, `time` 0.3.55, `globset` 0.4.20, `encoding_rs`
# 0.8.41 and `validator_derive` 0.20 each declare it — so the declaration costs
# nothing and buys two things: `cargo` refuses to build a crate whose dependency
# outgrew the promise instead of failing at a user's machine, and the
# MSRV-aware resolver (resolver "3" below) stops `cargo update` from resolving a
# version the floor cannot compile.
rust-version = "1.88"
version = "0.25.0"

# Every version below is the single source of truth for the workspace: a member
# referencing one of these crates MUST use `workspace = true` and may only add
# the features it needs. Pinning a version in a member manifest reintroduces
# multi-version drift (two `redis`/`async-nats` clients whose TLS and retry
# semantics can differ, two copies of a fixed advisory, doubled build cost);
# `cargo deny check` in CI fails on a new duplicate version.
[workspace.dependencies]
# async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1.12" }
async-trait = { version = "0.1.88" }
futures = { version = "0.3.31" }
futures-util = { version = "0.3.31" }
async-stream = { version = "0.3.6" }
# serialization / configuration
serde = "1.0.219"
serde_json = "1.0.140"
serde_yaml = "0.9"
toml = "1.1.6"
jsonschema = { version = "0.56.0", default-features = false }
# logging
tracing = "0.1"
tracing-subscriber = "0.3"
# errors
anyhow = "1.0.100"
thiserror = "2"
# utilities
chrono = "0.4"
regex = "1.11"
globset = { version = "0.4", default-features = false }
nanoid = "0.5"
parking_lot = "0.12"
cron = "0.12"
strum = { version = "0.27", features = ["derive"] }
# expression language (the engine's `${{ }}` / `if` evaluator).
#
# The workspace's own evaluator, not a third-party one: it was `cel` 0.14 for a
# few unreleased commits, and the measurements that ended that are in the
# changelog. A member that needs the value <-> `serde_json` bridge turns on the
# `json` feature (see `crates/acts`), which is off by default so the crate
# itself has no dependencies at all.
acts-expr = { path = "./crates/acts-expr", version = "0.25.0" }
# grpc / web
# 0.14 is split: `tonic` is the transport and the generated code's skeleton, the
# prost codec and its codegen are the separate `tonic-prost`/`tonic-prost-build`
# crates, and the `prost` feature is gone. The generated bindings therefore name
# `tonic_prost::ProstCodec`, and a member that wants it must depend on the crate
# (see acts-proto).
tonic = { version = "0.14", default-features = false, features = [
    "channel",
    "codegen",
] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
axum = "0.8"
validator = { version = "0.21.0", features = ["derive"] }
# shell
# `acts-package-shell` runs a workflow's script in bashkit's virtual bash. The
# `realfs` feature is what lets the interpreter's root be the run's own
# directory; the default features (the LLM tool contract, tz data) are not used
# here.
bashkit = { version = "0.18", default-features = false, features = [
    "realfs",
] }
# message brokers / stores
async-nats = "0.50"
redis = { version = "1.7", default-features = false, features = [
    "aio",
    "tokio-comp",
] }
# dev
serial_test = { version = "3", features = ["async"] }
acts = { path = "./crates/acts", version = "0.25.0" }
acts-channel = { path = "./crates/acts-channel", version = "0.25.0" }
acts-proto = { path = "./crates/acts-proto", version = "0.25.0" }
acts-store = { path = "./crates/acts-store", version = "0.25.0" }
acts-package-http = { path = "./packages/acts-package-http", version = "0.25.0" }
acts-package-shell = { path = "./packages/acts-package-shell", version = "0.25.0" }
acts-package-state = { path = "./packages/acts-package-state", version = "0.25.0" }
acts-package-nats = { path = "./packages/acts-package-nats", version = "0.25.0" }
acts-package-javascript = { path = "./packages/acts-package-javascript", version = "0.25.0" }
acts-plugin-grpc = { path = "./plugins/acts-plugin-grpc", version = "0.25.0" }
acts-plugin-web = { path = "./plugins/acts-plugin-web", version = "0.25.0" }
acts-plugin-nats = { path = "./plugins/acts-plugin-nats", version = "0.25.0" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
