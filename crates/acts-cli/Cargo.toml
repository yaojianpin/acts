[package]
authors.workspace = true
description = "Acts workflow cli client"
keywords = ["workflow", "acts", "client"]
edition.workspace = true
license.workspace = true
name = "acts-cli"
repository.workspace = true
homepage = "https://github.com/yaojianpin/acts"
version.workspace = true

[dependencies]
acts-channel = { workspace = true }
anyhow = { workspace = true }
chrono = "0.4.24"
clap = { version = "4.5.21", features = ["derive", "color"] }
clap-cargo = "0.14.1"
comfy-table = "7.2.2"
futures = "0.3.27"
once_cell = "1.17.1"
owo-colors = "4.1.0"
regex = "1.11.1"
serde = { version = "1.0.158", features = ["derive"] }
serde_json = "1.0.94"
serde_yaml = "0.9.34"
shlex = "1.3.0"
tokio = { version = "1.26.0", features = ["rt-multi-thread"] }
tonic = "0.8.3"
