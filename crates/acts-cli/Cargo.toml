[package]
authors.workspace = true
description = "Acts workflow cli client"
keywords = ["workflow", "acts", "client"]
edition.workspace = true
license.workspace = true
name = "acts-cli"
repository.workspace = true
homepage = "https://github.com/yaojianpin/acts"
version.workspace = true
rust-version.workspace = true

[dependencies]
acts-channel = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5.21", features = ["derive", "color", "env"] }
clap-cargo = "0.14.1"
comfy-table = "8.0.0"
owo-colors = "4.1.0"
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shlex = "2"
tokio = { features = ["rt-multi-thread"], workspace = true }

# The tests drive the command layer against a real server: the shipped engine
# with the shipped gRPC plugin — the server `acts-server` assembles — so the
# CLI is checked against the server it talks to in production, and the test
# build stays the client's (no store, no packages).
[dev-dependencies]
acts = { workspace = true }
# The user registry lives in its own crate now: a case that logs in (or reads
# `engine.acl()`'s user registry) installs it on the builder with
# `with_user_acl()`.
acts-acl = { workspace = true }
acts-plugin-grpc = { workspace = true }
