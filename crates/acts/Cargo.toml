
[package]
authors = ["Yao <yaojianpin@sohu.com>"]
description = "a fast, lightweight, extensiable workflow engine"
keywords = ["workflow"]
edition = "2024"
license = "Apache-2.0"
name = "acts"
homepage = "https://docs.rs/acts"
repository = "https://github.com/yaojianpin/acts.git"
# What the registry tarball carries, in the paths it packs them at: an entry
# that escapes the package root packs nothing at all (`../README.md` used to be
# one, and the published crate then carried no README and no license), and
# `cargo package` builds what it packs, so `src/lib.rs` can document itself from
# the `README.md` beside this manifest. That README and `LICENSE` are copies of
# the repository's own, kept identical by the `crate-files` job in
# `.github/workflows/rust.yml`.
include = ["src/**/*", "LICENSE", "README.md", "!**/tests/**/*"]
version.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { features = ["full", "macros"], workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
globset = { default-features = false, workspace = true }
inventory = "0.3.20"
jsonschema = { workspace = true }
nanoid = { workspace = true }
regex = { workspace = true }
acts-expr = { features = ["json", "regex"], workspace = true }
serde = { features = ["derive", "rc"], workspace = true }
serde_json = { workspace = true }
serde_repr = "0.1"
serde_yaml = { workspace = true }
strum = { features = ["derive"], workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dashmap = "6.1.0"
tokio-util = "0.7.18"
parking_lot = { workspace = true }
bitflags = { version = "2.13.1", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio", "async_futures"] }
serial_test = { workspace = true }
tracing-subscriber = { features = ["env-filter"], workspace = true }
parking_lot = { workspace = true }

