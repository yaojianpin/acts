[package]
authors.workspace = true
description = "external KvStore backends (sqlite / postgres / sled) for the acts workflow engine"
keywords = ["workflow", "store"]
edition.workspace = true
license.workspace = true
name = "acts-store"
repository.workspace = true
homepage = "https://github.com/yaojianpin/acts"
version.workspace = true
include = ["src/**/*"]

[dependencies]
acts = { workspace = true }
async-trait = { workspace = true }
sled = { version = "0.34", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio"], optional = true }
tokio = { features = ["rt", "sync"], workspace = true }

[dev-dependencies]
acts = { workspace = true }
nanoid = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tokio = { features = ["macros", "rt-multi-thread", "sync", "time"], workspace = true }
tracing-subscriber = { features = ["env-filter"], workspace = true }

[features]
default = []
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls"]
sled = ["dep:sled"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
