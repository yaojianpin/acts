[package]
authors.workspace = true
description = "external KvStore backends (sqlite / postgres / redis / nats / sled) for the acts workflow engine"
keywords = ["workflow", "store"]
edition.workspace = true
license.workspace = true
name = "acts-store"
repository.workspace = true
homepage = "https://github.com/yaojianpin/acts"
version.workspace = true
include = ["src/**/*"]

[dependencies]
acts = { workspace = true }
async-trait = { workspace = true }
async-nats = { version = "0.49.1", optional = true }
futures = { version = "0.3", optional = true }
redis = { version = "0.27", optional = true, features = ["aio", "tokio-comp"] }
sled = { version = "0.34", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio"], optional = true }
tokio = { version = "1.52", features = ["rt", "sync"] }

[dev-dependencies]
acts = { workspace = true }
nanoid = "0.4"
serde_json = { workspace = true }
serial_test = { version = "3", features = ["async"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
nats = ["dep:async-nats", "dep:futures"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls"]
redis = ["dep:redis"]
sled = ["dep:sled"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
