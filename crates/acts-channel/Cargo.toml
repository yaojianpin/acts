[package]
name = "acts-channel"
description = "acts client channel for acts-server"
documentation = "https://github.com/yaojianpin/acts"
homepage = "https://github.com/yaojianpin/acts"
keywords = ["workflow-channel"]
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.98"
chrono = "0.4.38"
futures = "0.3.28"
nanoid = "0.4.0"
prost = "0.13"
prost-types = "0.13"
regex = "1.11.1"
serde = { version = "1.0.158", features = ["derive"] }
serde_json = "1.0.94"
serde_yaml = "0.9.34"
thiserror = "1.0.66"
tokio = "1.29.1"
tokio-stream = { version = "0.1.16", features = ["net"] }
tonic = "0.12"

[build-dependencies]
tonic-build = { version = "0.12" }
protoc-bin-vendored = { version = "3", optional = true }

[features]
default = []
codegen = ["dep:protoc-bin-vendored"]
docker_test = []

[dev-dependencies]
acts = { workspace = true }
