[package]
name = "acts-channel"
description = "acts client channel for acts-server"
documentation = "https://github.com/yaojianpin/acts"
homepage = "https://github.com/yaojianpin/acts"
keywords = ["workflow-channel"]
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
parking_lot = { workspace = true }
acts-proto = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# `transport` carries the `server` + `channel` features the client and its test
# harness use (`tonic::transport::{Channel, Endpoint, Server}`).
tonic = { features = ["transport"], workspace = true }
tokio = { workspace = true }
tokio-stream = { features = ["net"], workspace = true }

[dev-dependencies]
acts = { workspace = true }
# The user registry lives in its own crate now: a case that logs in (or reads
# `engine.acl()`'s user registry) installs it on the builder with
# `with_user_acl()`.
acts-acl = { workspace = true }
futures = { workspace = true }
# The tests boot the server the way `acts-server` boots it — the shipped engine
# with the shipped gRPC plugin — so the client is exercised against the server
# it talks to in production rather than a second implementation of it.
acts-plugin-grpc = { workspace = true }
