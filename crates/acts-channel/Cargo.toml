[package]
name = "acts-channel"
description = "acts client channel for acts-server"
documentation = "https://github.com/yaojianpin/acts"
homepage = "https://github.com/yaojianpin/acts"
keywords = ["workflow-channel"]
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
nanoid = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
regex = { workspace = true }
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# `transport` carries the `server` + `channel` features the client and its test
# harness use (`tonic::transport::{Channel, Endpoint, Server}`).
tonic = { features = ["transport"], workspace = true }
# The generated bindings name the prost codec (`tonic_prost::ProstCodec`),
# which `tonic` no longer carries since 0.14.
tonic-prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { features = ["net"], workspace = true }

[build-dependencies]
# `transport` is what generates the `connect`/`Channel` halves of the bindings.
# `cleanup-markdown` (a default in 0.14) is off: it only reformats generated doc
# comments through `pulldown-cmark`, and the old `tonic-build` did not have it
# on, so the committed `proto/acts.grpc.rs` is generated identically without the
# extra build-time dependencies.
tonic-prost-build = { version = "0.14", default-features = false, features = [
    "transport",
] }
protoc-bin-vendored = { version = "3", optional = true }

[features]
default = []
codegen = ["dep:protoc-bin-vendored"]
docker_test = []

[dev-dependencies]
acts = { workspace = true }
