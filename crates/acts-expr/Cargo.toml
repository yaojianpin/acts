[package]
authors.workspace = true
description = "the acts expression evaluator: a dependency-free parser and interpreter for the simple expressions a workflow carries"
keywords = ["workflow", "expression"]
edition.workspace = true
license.workspace = true
name = "acts-expr"
repository.workspace = true
homepage = "https://github.com/yaojianpin/acts"
version.workspace = true
rust-version.workspace = true
include = ["src/**/*"]

[dependencies]
# The core evaluator — a lexer, a parser and a tree walk over its own value
# type — has no dependencies; both entries below are behind features that are
# off by default.
serde_json = { optional = true, workspace = true }
# `is_match(pattern)` is the one built-in method that needs a regular
# expression engine. The engine already depends on `regex` for the `${{ }}`
# scanner, so turning it on there costs it nothing.
regex = { optional = true, workspace = true }

[features]
# `Value` <-> `serde_json::Value` conversion, for hosts (the engine) that speak
# JSON.
json = ["dep:serde_json"]
# The `is_match(pattern)` string method.
regex = ["dep:regex"]

[[bench]]
name = "expr"
harness = false
