[package]
authors.workspace = true
description = "A simple, fast, tiny acts workflow server"
keywords = ["workflow", "acts", "server"]
edition.workspace = true
license.workspace = true
name = "acts-server"
repository.workspace = true
homepage = "https://github.com/yaojianpin/acts"
version.workspace = true

[dependencies]
anyhow = { workspace = true }
acts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3.36", features = ["macros"] }
tokio = { version = "1.26.0", features = ["full"] }
tracing = "0.1.37"
tracing-appender = "0.2.2"
tracing-subscriber = { version = "0.3.16", features = [
    "local-time",
    "env-filter",
] }
acts-package-http = { path = "../../packages/acts-package-http" }
acts-package-shell = { path = "../../packages/acts-package-shell" }
acts-package-state = { path = "../../packages/acts-package-state" }
acts-package-nats = { path = "../../packages/acts-package-nats" }
acts-plugin-grpc = { path = "../../plugins/acts-plugin-grpc" }
acts-plugin-web = { path = "../../plugins/acts-plugin-web" }
acts-plugin-nats = { path = "../../plugins/acts-plugin-nats" }
acts-channel = { workspace = true }
acts-store = { workspace = true, features = ["sled"] }
[dev-dependencies]
async-nats = "0.50"

[features]
default = []
