[package]
name = "acts-package-shell"
description = "acts package for shell"
homepage = "https://docs.rs/acts-package-http"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
acts = { workspace = true }
async-trait = { workspace = true }
bashkit = { workspace = true }
globset = { default-features = true, workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The harness logs in as its own user, so the engine needs the store-backed
# registry the ACL crate ships.
acts-acl = { workspace = true }
toml = { workspace = true }
