[package]
name = "acts-plugin-nats"
description = "NATS server plugin for acts workflow engine — message actions and events over NATS"
license = "Apache-2.0"
keywords = ["workflow", "acts", "nats"]
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
acts = { workspace = true }
async-nats = { workspace = true }
# the inbound payload's type: the admitted task holds an owned `Bytes` clone
# (a buffer share, not a copy) so the borrowed `data` extent survives the spawn
bytes = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
# `raw_value`: the inbound `data` is pinned as a borrowed `RawValue`, so the
# envelope parse validates it without decoding a byte of it
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The ACL case declares its own user: the registry is a separate crate, and a
# bare engine refuses every `acl:*` action without it.
acts-acl = { workspace = true }
# The broker-failure case builds a `[nats]` config table in memory.
toml = { workspace = true }
