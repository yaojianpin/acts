[package]
name = "acts-plugin-nats"
description = "NATS server plugin for acts workflow engine — message actions and events over NATS"
license = "Apache-2.0"
keywords = ["workflow", "acts", "nats"]
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
acts = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The ACL case declares its own user: the registry is a separate crate, and a
# bare engine refuses every `acl:*` action without it.
acts-acl = { workspace = true }
