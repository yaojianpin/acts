[package]
name = "acts-plugin-grpc"
description = "gRPC server plugin for acts workflow engine"
license = "Apache-2.0"
keywords = ["workflow", "acts", "grpc"]
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
acts = { workspace = true }
# The generated bindings of the wire protocol — the service this plugin
# implements and the messages it carries. Not `acts-channel`: the client crate
# is a *user* of this server, and depending on it would make the two form the
# cycle that keeps either from being published.
acts-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# `net` wraps a pre-bound `std` listener into the incoming stream tonic serves.
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
toml = { workspace = true }
