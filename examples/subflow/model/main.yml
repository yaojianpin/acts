name: main
id: main
ver: 0.1.0
vars:
  - name: v
    value: 0
exposes:
  - name: result
    value: ${{ v }}
    type: number
steps:
  - name: prepare
    id: prepare
    uses: acts.core.irq
    params: 
      key: init

  - name: enter sub workflow
    uses: acts.core.subflow
    params:
        to: sub
        extra:
          v: ${{ v }}

  - name: final
    id: final
    uses: acts.core.irq
    params:
      key: action2
      v: ${{ v }}

    
