name: event model
id: my-event-model
ver: 0.1.0
on:
  # start by manual and return the result directly
  - id: event-manual
    kind: manual
    name: start by manual
    params:
      result: 0

  # start by hook and return the result until the workflow completes
  - id: event-hook
    kind: hook
    name: start by hook

  # start by chat string
  - id: event-chat
    kind: chat
    name: start by chat

  # start every minute by the engine timer (cron: sec min hour day month dow)
  - id: event-schedule
    kind: schedule
    name: start by schedule
    schedule: "0 * * * * *"
    params:
      result: 0

steps:
  - name: step 1
  - name: step 2
    uses: acts.transform.set
    params:
      result: 100
