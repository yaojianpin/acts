name: shell example
id: shell-example
ver: 0.1.0
vars:
  - name: my_input
    value: "hello, world"
steps:
  - name: shell step
    uses: acts.app.shell
    params:
      shell: bash
      content-type: json
      script: |
        printf '{"data": "%s"}\n' "${{ my_input }}"

  - name: work in the run's directory
    uses: acts.app.shell
    params:
      shell: bash
      script: |
        # `/` is this run's own directory, and nothing else of the host:
        # a relative path stays inside it, and the host sees the file too
        echo "hello" > greeting.txt
        cat greeting.txt
