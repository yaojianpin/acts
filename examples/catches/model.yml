name: a example to catch act error
id: catches
steps:
  - name: prepare
    id: prepare
    uses: acts.core.irq
    params:
      key: init
  - name: step1
    id: step1
    uses: acts.core.irq
    params:
      key: act1
    catches:
      - uses: acts.core.msg
        if: $ecode() == 'err1'
        params:
          key: catch1
      - uses: acts.core.msg
        if: $ecode() == 'err2'
        params:
          key: catch2
      - uses: acts.core.msg
        params:
          key: others

  - name: final
    id: final