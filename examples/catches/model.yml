name: a example to catch act error
id: catches
ver: 0.1.0
steps:
  - name: prepare
    id: prepare
    uses: acts.core.irq
    params:
      key: init
  - name: step1
    id: step1
    uses: acts.core.irq
    params:
      key: act1
    catches:
      - name: gate way
        branches:
          - if: $ecode() == 'err1'
            steps:
              - uses: acts.core.msg
                params:
                  key: catch1
          - if: $ecode() == 'err2'
            steps:
              - uses: acts.core.msg
                params:
                  key: catch2

          - else: true
            steps:
              - uses: acts.core.msg
                params:
                  key: others

  - name: final
    id: final