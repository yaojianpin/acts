[package]
name = "acts-example-perf"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
tokio = { features = ["full"], workspace = true }
acts = { workspace = true }
# The prof harness measures the in-memory engine path and the durable
# sled/RocksDB paths (with optional physical sharding); the store crate owns
# the backends, so the example is a package of its own (an example of `acts`
# cannot depend on `acts-store`, which depends on `acts`).
acts-store = { workspace = true, features = ["sled", "rocksdb"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
