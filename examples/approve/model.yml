name: approve
id: approve
ver: 0.1.0
steps:
  - name: prepare
    id: prepare
    desc: prepare the model and set the initial value
    uses: acts.core.irq
    params:
      key: init
      
  - name: pm approval
    id: pm_approval
    desc: move to next step when all of the users in pm role approves the act
    uses: acts.core.block
    vars:
      - name: pm
        value: []
    params:
      mode: sequence
      acts:
        - uses: acts.core.irq
          params:
            key: pm
            role_id: pm
          options:
            exposes:
              - name: pm
        # parse the pm variable from prev act
        # and parallel run multiple acts
        - uses: acts.core.parallel
          params:
            in: '{{ pm }}'
            acts:
              - uses: acts.core.irq
                params:
                  key: pm_act
              - uses: acts.core.msg
                params:
                  key: pm_act_msg
   

  - name: gm approval
    id: gm_approval
    desc: move to next when any of the users in gm role approves the act
    uses: acts.core.block
    vars: 
      - name: gm
        value: []
    params:
      mode: sequence
      acts:
        - uses: acts.core.irq
          params:
            key: gm
            role_id: gm
          options:
            exposes:
              - name: gm
        # parallel generate multiple acts
        - uses: acts.core.parallel
          params:
            in: '{{ gm }}'
            acts:
              - uses: acts.core.msg
                params:
                  key: gm_act_msg
        # generate an irq and wait util completed
        - uses: acts.core.irq
          params:
            key: gm_act
