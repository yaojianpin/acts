name: approve
id: approve
ver: 0.1.0
steps:
  # ---------------------------------------------------------------------------
  # step 1 · prepare
  # A plain irq act the client completes at once: it just marks the run as
  # started.
  # ---------------------------------------------------------------------------
  - name: prepare
    id: prepare
    desc: mark the run started; the client completes it immediately
    uses: acts.core.irq
    params:
      key: prepare

  # ---------------------------------------------------------------------------
  # step 2 · pm approval — countersign with join: all
  #
  # `pm_review` collects the pm users (the client answers with the user list,
  # exposed as the step var `pm`), then the parallel fans one [pm_vote +
  # pm_notify] pair out per user: every pm user gets an irq act to answer and
  # a msg act that just announces.
  #
  # `join: all` is the default spelled out: every user's pair must complete
  # before the step continues, and a failed vote fails the step.
  #
  # On `pm_review`'s Created the client also demonstrates the countersign
  # pair: it pushes an added approver (`pm_added`) under the step, and on the
  # pushed act's Created removes it again — the step waits for the pushed act
  # until it is dropped, then continues.
  # ---------------------------------------------------------------------------
  - name: pm approval
    id: pm_approval
    desc: every pm user approves (join all); the client pushes an added approver and removes it again on this step
    uses: acts.core.block
    vars:
      - name: pm
        value: []
    params:
      mode: sequence
      steps:
        # collect the pm users, then fan one pair out per user
        - uses: acts.core.irq
          params:
            key: pm_review
            role_id: pm
          exposes:
            - name: pm
        - uses: acts.core.parallel
          params:
            in: '${{ pm }}'
            join: all
            steps:
              # the vote each pm user answers
              - uses: acts.core.irq
                params:
                  key: pm_vote
              # the announcement each pm user triggers
              - uses: acts.core.msg
                params:
                  key: pm_notify

  # ---------------------------------------------------------------------------
  # step 3 · gm approval — join: any
  #
  # `gm_review` collects the gm users, then the parallel fans one [gm_notify +
  # gm_vote] pair out per gm user with `join: any`: the first gm user's vote
  # completes the step, and the other users' still-pending votes are withdrawn
  # (the client's later vote answers are refused — the step already passed).
  # ---------------------------------------------------------------------------
  - name: gm approval
    id: gm_approval
    desc: any one gm user's vote passes the step (join any)
    uses: acts.core.block
    vars:
      - name: gm
        value: []
    params:
      mode: sequence
      steps:
        # collect the gm users, then fan one [notify + vote] pair out per user
        - uses: acts.core.irq
          params:
            key: gm_review
            role_id: gm
          exposes:
            - name: gm
        - uses: acts.core.parallel
          params:
            in: '${{ gm }}'
            join: any
            steps:
              # the announcement each gm user triggers
              - uses: acts.core.msg
                params:
                  key: gm_notify
              # the vote each gm user may answer; the first one decides
              - uses: acts.core.irq
                params:
                  key: gm_vote

  # ---------------------------------------------------------------------------
  # step 4 · board countersign — join: action
  #
  # The delegated join: the chair and the deputy vote, and the
  # engine asks the client to decide — one `acts.core.join` request per vote
  # that lands, carrying every vote's state and outputs. The client's
  # `board_decision` handler passes the step when the chair approved,
  # whatever the deputy answered.
  # ---------------------------------------------------------------------------
  - name: board countersign
    id: board_countersign
    desc: the client decides the delegated join; the chair's approval passes the step
    uses: acts.core.block
    params:
      mode: parallel
      join:
        action: board_decision
        params:
          chair: chair
          deputy: deputy
      steps:
        - uses: acts.core.irq
          params:
            key: board_chair
          exposes:
            - name: role
        - uses: acts.core.irq
          params:
            key: board_deputy
