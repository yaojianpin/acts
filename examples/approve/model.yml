name: approve
id: approve
ver: 0.4.0

vars:
  - name: amount
    value: 800
steps:
  # ---------------------------------------------------------------------------
  # step 1 · prepare
  # A plain irq act the client completes at once: it just marks the run as
  # started.
  # ---------------------------------------------------------------------------
  - name: prepare
    id: prepare
    desc: mark the run started; the client completes it immediately
    uses: acts.core.irq
    vars:
      # the client can auto-submit the prepare act, when first starting the workflow, to avoid the extra click
      - name: auto_submit
        value: true
    params:
      key: prepare
    rules:
      - if: 'auto_submit'
        message: auto submit the prepare act on workflow start
        action: submit
        params:
          # auto close the auto_submit flag, so the next run of the workflow will not auto submit the prepare act
          auto_submit: false

  # ---------------------------------------------------------------------------
  # step 2 · pm countersign — the pool comes from assign.candidates (join: all)
  #
  # `assign.candidates` asks the client's business directory for the pm users
  # (`{kind: role, name: pm}`); the answer lands in the act's variables as the
  # candidate pool, and the fan-out (`in: "${{ $assign.candidates.ids }}"`) reads
  # the act's own pool. `join: all` is the countersign: every pm user must
  # approve.
  #
  # The step's Created message carries the step's identity (its tid). The
  # step declares `announce: true`, so the Created arrives the moment the
  # step starts — before its candidate pool resolves, with the raw declared
  # params — and the interactive client sees the countersign from its first
  # breath. (A container itself holds no assignment — an owner declaration
  # would be inherited by the children — so `add approver` on it hangs a
  # plain member act under it, whom the join: all then waits for; on an
  # owned act the menu builds a before/after sign chain instead.) Each vote
  # is answered in the terminal menu, where the supervisor can also urge
  # (act:remind) a pending act.
  # ---------------------------------------------------------------------------
  - name: pm countersign
    id: pm_approval
    desc: every pm user approves (join all); answer the votes in the menu
    uses: acts.core.parallel
    announce: true
    params:
      in: '${{ $assign.candidates.ids }}'
      join: all
      steps:
        - uses: acts.core.irq
          params:
            key: pm_vote
          assign:
            owner: '${{ $item.value }}'
    assign:
      candidates:
        params:
          kind: role
          name: pm

  # ---------------------------------------------------------------------------
  # step 3 · gm approval — the same pool shape with join: any
  #
  # The first gm user's vote completes the step (or-sign); the other votes are
  # withdrawn by the join, and a later answer is refused — the client ignores
  # it.
  # ---------------------------------------------------------------------------
  - name: gm approval
    id: gm_approval
    desc: any one gm user's vote passes the step (join any)
    uses: acts.core.parallel
    params:
      in: '${{ $assign.candidates.ids }}'
      join: any
      steps:
        - uses: acts.core.irq
          params:
            key: gm_vote
          assign:
            owner: '${{ $item.value }}'
    assign:
      candidates:
        params:
          kind: role
          name: gm

  # ---------------------------------------------------------------------------
  # step 4 · post approval — an or-sign over the post principals
  #
  # The pool is the union of the department's and the unit's principals
  # (`owners_of` with duty principal), so both posts' holders are candidates.
  # The pool deduplicates: when one person holds both posts (the demo's
  # directory does), she appears once and her single vote passes the step —
  # the concurrent post never approves twice. Different holders would give two
  # candidates, and `join: any` lets either of them pass the step.
  # ---------------------------------------------------------------------------
  - name: post approval
    id: post_approval
    desc: an or-sign over the department and unit principals; one person holding both posts votes once
    uses: acts.core.parallel
    announce: true
    params:
      in: '${{ $assign.candidates.ids }}'
      join: any
      steps:
        - uses: acts.core.irq
          params:
            key: post_vote
          assign:
            owner: '${{ $item.value }}'
    assign:
      candidates:
        params:
          kind: any_of
          operands:
            - { kind: owners_of, resource: { resource: department, name: rd }, duty: principal }
            - { kind: owners_of, resource: { resource: unit, name: rd_center }, duty: principal }

  # ---------------------------------------------------------------------------
  # step 5 · expense approval — skip
  #
  # The rule skips the whole approval when the amount is within the limit:
  # the container is dropped and the flow continues. (The pool request still
  # resolves first — the directory answers what the pool declares.)
  # ---------------------------------------------------------------------------
  - name: expense approval
    id: expense_approval
    desc: skipped when the amount is within the limit; otherwise any finance principal approves
    uses: acts.core.parallel
    announce: true
    params:
      in: '${{ $assign.candidates.ids }}'
      join: any
      steps:
        - uses: acts.core.irq
          params:
            key: finance_vote
          assign:
            owner: '${{ $item.value }}'
    rules:
      - if: '$root.amount <= $root.expense_limit'
        message: the expense is within the approval limit
        action: skip
    assign:
      candidates:
        params:
          kind: owners_of
          resource: { resource: department, name: finance }
          duty: principal

  # ---------------------------------------------------------------------------
  # step 6 · board approval — join: action
  #
  # The delegated join: the chair and the deputy vote, and the engine asks the
  # client to decide — one `acts.core.decide` request per vote that lands,
  # carrying every vote's state and outputs. The client's `board_decision`
  # handler passes the step when the chair approved, whatever the deputy
  # answered.
  # ---------------------------------------------------------------------------
  - name: board approval
    id: board_approval
    desc: the client decides the delegated join; the chair's approval passes the step
    uses: acts.core.block
    announce: true
    params:
      mode: parallel
      join:
        params:
          action: board_decision
          chair: chair
          deputy: deputy
      steps:
        - uses: acts.core.irq
          params:
            key: board_chair
          exposes:
            - name: role
        - uses: acts.core.irq
          params:
            key: board_deputy

  # ---------------------------------------------------------------------------
  # step 7 · assignment demo — transfer and delegate
  #
  # Two assigned approvals whose owners are set up for the assignment
  # actions: in the menu, `transfer` moves `transfer_vote` (owned by user 1)
  # to another user and the new owner answers the same act; `delegate` lets
  # another user decide `delegate_vote` (owned by user 2) for the owner. A
  # transfer would clear a delegation; a delegate keeps the owner and adds
  # an assignee.
  # ---------------------------------------------------------------------------
  - name: assignment demo
    id: assignment_demo
    desc: transfer and delegate these human approvals in the menu
    uses: acts.core.block
    announce: true
    params:
      mode: sequence
      steps:
        - uses: acts.core.irq
          assign:
            owner: '1'
          params:
            key: transfer_vote
        - uses: acts.core.irq
          assign:
            owner: '2'
          params:
            key: delegate_vote

  # ---------------------------------------------------------------------------
  # step 8 · sign chain demo — the before and after signs
  #
  # Two single-owner approvals to try the sign chains on. A container never
  # holds its own assignment, so the chains ride these one-person acts: in
  # the menu, `add approver` on `before_sign` (owned by user 1) with mode
  # `before` runs the added approver ahead of the owner; on `after_sign`
  # (owned by user 3) the default `after` runs the owner first, the added
  # approver behind him. Each chain leaf is an irq act named after its
  # owner; the owner's own answer is absorbed on the push, `remove approver`
  # drops a leaf and the kernel admits the next, and the drained chain
  # completes the act.
  # ---------------------------------------------------------------------------
  - name: sign chain demo
    id: sign_demo
    desc: try the before/after sign chains on these single-owner acts
    uses: acts.core.block
    announce: true
    params:
      mode: sequence
      steps:
        - uses: acts.core.irq
          id: before_sign
          assign:
            owner: '1'
          params:
            key: before_sign
        - uses: acts.core.irq
          id: after_sign
          assign:
            owner: '3'
          params:
            key: after_sign
