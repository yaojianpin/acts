[package]
name = "acts-example-approve"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
# terminal prompts: the demo clients' menus are arrow-key selects; the
# default features pull an editor and password hashing this repo never uses
dialoguer = { version = "0.12", default-features = false }
# command line
clap = { version = "4.5.21", features = ["derive", "color", "env"] }
clap-cargo = "0.19.0"
tokio = { features = ["full"], workspace = true }
acts = { workspace = true }
anyhow = { workspace = true, features = ["backtrace"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { features = [
    "local-time",
    "env-filter",
], workspace = true }
