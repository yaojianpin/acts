name: while
id: while
ver: 0.1.0
vars:
  - name: input
    value: 5
  - name: index
    value: 0
  - name: value
    value: 0
exposes:
  - name: result
    value: ${{ value }}
steps:
  - name: init
    id: init
    uses: acts.transform.set
    params:
      value: 0
      index: 0

  - name: add
    id: add
    while: index <= input
    uses: acts.transform.set
    params:
      value: '${{ value + index }}'
      index: '${{ index + 1 }}'

  - name: end
    id: end
