name: simple
id: simple
ver: 0.1.0
vars:
  - name: input
    value: 4
  - name: index
    value: 0
  - name: value
    value: 0
exposes:
  - name: result
    value: ${{ value }}
    type: number
steps:
  - name: init
    id: init
    uses: acts.transform.code
    params: |
      $set("value", 0);
      $set("index", 0);

  - name: cond
    id: cond
    branches:
      - name: "<=input"
        id: "<=input"
        if: |
          index <= input
        steps:
          - name: add
            id: add
            next: cond
            uses: acts.transform.code
            params: |
              $set("value", value + index);
              $set("index", index + 1);

      - name: ">input"
        id: ">input"
        if: index > input
  - name: end
    id: end
    