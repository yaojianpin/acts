name: actions
id: actions
vars:
  - name: v
    value: 0  
options:
  exposes:
    - name: result
      value: '{{ v }}'
steps:
  - name: prepare
    id: prepare
    uses: acts.core.irq
    params:
      key: init

  - name: condition
    id: condition
    branches:
      - name: cond 1
        id: cond1
        if: v > 0
        steps:
          - name: step1
            id: step1
            uses: acts.core.irq
            params:
              key: action1 
              v: '{{ v }}'

          - name: step2
            id: step2
            uses: acts.core.irq
            params:
                key: action2
                v: '{{ v }}'   
   
      - name: cond 2
        id: cond2
        else: true
        steps:
          - id: step3
            name: step3
            uses: acts.core.irq
            params:
              key: action3

  - name: final
    id: final
    uses: acts.core.irq
    params:
      key: action4
      v: '{{ v }}'
  

