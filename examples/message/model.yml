name: event_test
id: m1
vars:
  - name: value
    value: 0

steps:
  - name: step 1
    id: step1
  - name: step 2
    id: step2
    uses: acts.transform.set
    params:
      value: 100
  - name: step 3
    id: step3
    uses: acts.core.block
    params:
      mode: sequence
      acts:
        - uses: acts.core.msg
          params:
            key: msg1
            a: '{{ value + 10 }}'
        - uses: acts.core.msg
          params:
            key: msg2
            b: '{{ value + 20 }}'
  - name: step 4
    