name: a timeout example
id: timeout_model
steps:
  - name: prepare
    id: prepare
    uses: acts.core.irq
    params:
      key: init
  - name: step1
    id: step1
    uses: acts.core.irq
    params:
      key: act1
    timeouts:
      - uses: acts.core.msg
        if: $cost_in('2s')
        params:
          key: step1_timeout_2s
          a: 1

      - uses: acts.core.irq
        if: $cost_in('5s')
        params:
          key: step1_timeout_5s
          a: 2

      - uses: acts.core.action
        if: $cost_in('8s')
        params:
          action: error
          options:
            ecode: err_timeout_8s

  - name: final
    id: final