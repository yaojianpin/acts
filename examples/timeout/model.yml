name: a timeout example
id: timeout_model
steps:
  - name: prepare
    id: prepare
    acts:
      - uses: acts.core.irq
        key: init
  - name: step1
    id: step1
    acts:
      - uses: acts.core.irq
        key: act1
    timeouts:
      - uses: acts.core.msg
        key: step1_timeout_2s
        if: $cost_in('2s')
        params:
          a: 1

      - uses: acts.core.irq
        key: step1_timeout_5s
        if: $cost_in('5s')
        params:
          a: 2

      - uses: acts.core.action
        if: $cost_in('8s')
        params:
          action: error
          options:
            ecode: err_timeout_8s

  - name: final
    id: final