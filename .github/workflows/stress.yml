name: stress

# `examples/stress` under CI.
#
# What this gate asserts is deterministic: every measured workflow completes,
# the error rate is zero, no phase times out, background health never degrades,
# and after the cleanup drain the read model and the durable aggregate family
# are empty. Those are invariants of the engine, not timings — the repo's
# `bench-compile` job explains why a wall-clock threshold would be a random red
# on a shared runner. Throughput, peak RSS and latency are therefore *published*
# as badges and in the report, never gated against a fixed number.
#
# A pull request runs a 1,000-workflow performance smoke at concurrency 16 for
# every store. The publishing shape stages the durable stores: three tiers whose
# counts total 1,000,000 workflows per store (100,000 -> 300,000 -> 600,000).
# Every tier runs the same 4 scheduler workers, 4 store writers and 4 physical
# shards: the workload is CPU-bound on the runner's 4 vCPUs (4/4/4 already peaks
# at 354-385% of 400%), so a worker ramp cannot add throughput. Each tier is its
# own job after the baseline passes, so a slow tier cannot hide the smaller
# reports. Every harness step has a hard timeout (60/150/300 min), so a stalled
# run fails the gate instead of consuming the job's 6-hour cap (the 100,000-
# workflow baseline takes ~13 min for memory, ~29 min for sled and ~38 min for
# RocksDB on the 4-core runner). Memory keeps one store and one shard, at
# 100,000 workflows. Every run uses concurrency 16, the measured throughput
# knee; a manual dispatch can still request a ramp (for example 16,32,64) and
# the latency badges then publish its highest stage.
on:
  pull_request:
    paths:
      - 'crates/acts/src/scheduler/**'
      - 'crates/acts/src/store/**'
      - 'crates/acts-store/**'
      - 'examples/stress/**'
      - '.github/workflows/stress.yml'
      - '.github/scripts/badge.sh'
      - '.github/scripts/stress-badge.sh'
  push:
    branches: ['main', 'develop']
    paths:
      - 'crates/acts/src/scheduler/**'
      - 'crates/acts/src/store/**'
      - 'crates/acts-store/**'
      - 'examples/stress/**'
      - '.github/workflows/stress.yml'
      - '.github/scripts/badge.sh'
      - '.github/scripts/stress-badge.sh'
  schedule:
    # Monday 03:00 UTC — a weekly trend point even on quiet weeks.
    - cron: '0 3 * * 3'
  workflow_dispatch:
    inputs:
      concurrency:
        description: Comma-separated concurrency stages (16 is the throughput knee)
        required: false
        default: '16'
      cleanup_wait_seconds:
        description: Seconds to wait for terminal cleanup after the last phase
        required: false
        default: '300'
      soak_seconds:
        description: Steady-state soak seconds after the ramp (0 disables)
        required: false
        default: '0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STRESS_OUTPUT: target/stress-results

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Memory has no physical shards to scale; pin the workers anyway so a
          # different runner's core count cannot change the run.
          - store: memory
            tier: baseline
            shards: 1
            workers: 4
            store_workers: 4
            count: 100000
            timeout: 60
          - store: sled
            tier: baseline
            shards: 4
            workers: 4
            store_workers: 4
            count: 100000
            timeout: 60
          - store: rocksdb
            tier: baseline
            shards: 4
            workers: 4
            store_workers: 4
            count: 100000
            timeout: 60

    steps: &stress_steps
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Build the stress harness
        run: cargo build --release --locked -p acts-example-stress

      # The event picks the shape: a PR gets the short smoke (a build-sized run
      # that still exercises commit/load/recovery/cleanup for every store),
      # while the publishing legs use the tier's own count. Manual inputs win on
      # dispatch for the concurrency, cleanup and soak knobs.
      - name: Plan the run
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            count=1000
            concurrency=16
            cleanup=120
            soak=0
            label=smoke
          else
            count="${{ matrix.count }}"
            concurrency="${{ inputs.concurrency }}"; concurrency="${concurrency:-16}"
            cleanup="${{ inputs.cleanup_wait_seconds }}"; cleanup="${cleanup:-300}"
            soak="${{ inputs.soak_seconds }}"; soak="${soak:-0}"
            label=stress
          fi
          {
            echo "count=${count}"
            echo "concurrency=${concurrency}"
            echo "cleanup_wait_seconds=${cleanup}"
            echo "soak_seconds=${soak}"
            echo "label=${label}"
          } >> "$GITHUB_OUTPUT"

      - name: Run the stress harness
        id: stress
        # The harness exits non-zero on a failed gate; the report and the step
        # summary still have to be produced, so the step itself tolerates the
        # code and the "Enforce" step below fails the job.
        continue-on-error: true
        # Hard stop for a stalled engine. Without it a hang burns the job's
        # 6-hour cap and only surfaces as `cancelled` at the very end; the
        # report and summary run under `always()`, and Enforce fails the job
        # when this step did not succeed. A manual soak must fit the timeout.
        timeout-minutes: ${{ matrix.timeout }}
        shell: bash
        run: |
          set +e
          output="$STRESS_OUTPUT/${{ matrix.store }}-${{ matrix.tier }}"
          extra=(--store-shards "${{ matrix.shards }}")
          if [ -n "${{ matrix.workers }}" ]; then
            extra+=(--workers "${{ matrix.workers }}")
          fi
          if [ -n "${{ matrix.store_workers }}" ]; then
            extra+=(--store-workers "${{ matrix.store_workers }}")
          fi
          if [ "${{ matrix.store }}" != "memory" ]; then
            extra+=(--store-url "$STRESS_OUTPUT/${{ matrix.store }}-${{ matrix.tier }}-store")
          fi
          target/release/acts-example-stress \
            --count "${{ steps.plan.outputs.count }}" \
            --concurrency "${{ steps.plan.outputs.concurrency }}" \
            --warmup 100 \
            --soak-seconds "${{ steps.plan.outputs.soak_seconds }}" \
            --cleanup-wait-seconds "${{ steps.plan.outputs.cleanup_wait_seconds }}" \
            --store "${{ matrix.store }}" \
            ${extra[@]+"${extra[@]}"} \
            --output "$output" \
            --sample-ms 1000 \
            --max-error-rate-pct 0
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Summarize the run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$STRESS_OUTPUT/${{ matrix.store }}-${{ matrix.tier }}/report.json"
          if [ ! -f "$report" ]; then
            echo "## Stress (${{ matrix.store }} ${{ matrix.tier }}): no report" >> "$GITHUB_STEP_SUMMARY"
            echo "The harness exited before writing \`report.json\`; see the job log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Stress (${{ steps.plan.outputs.label }}: ${{ matrix.store }} ${{ matrix.tier }})"
            echo
            echo '| metric | value |'
            echo '| --- | --- |'
            jq -r '
              "| Result | \(.status) |",
              "| Completed | \(.total_completed)/\(.total_attempted) |",
              "| Errors / terminated | \(.total_errored) / \(.total_terminated) |",
              "| Throughput | \(.workflows_per_second * 10 | round / 10) workflows/s |",
              "| Peak RSS | \((.max_rss_bytes / 1073741824) * 100 | round / 100) GiB |",
              "| Process rows at the end | \(.final_process_rows) |",
              "| Residual aggregates / indexes | \(.residual_aggregate_documents) / \(.residual_index_documents) |",
              "| Degraded health samples | \(.degraded_health_samples) |",
              "| Elapsed | \(.elapsed_seconds * 10 | round / 10) s |"
            ' "$report"
            echo
            echo "Throughput and RSS are trend data, not a threshold: a shared runner's timings move by double-digit percents between runs. The gate is the invariant rows above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-${{ matrix.store }}-${{ matrix.tier }}
          path: |
            target/stress-results/${{ matrix.store }}-${{ matrix.tier }}/report.md
            target/stress-results/${{ matrix.store }}-${{ matrix.tier }}/report.json
            target/stress-results/${{ matrix.store }}-${{ matrix.tier }}/metrics.csv
            target/stress-results/${{ matrix.store }}-${{ matrix.tier }}/trace.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce the stress result
        if: always()
        shell: bash
        run: |
          outcome="${{ steps.stress.outcome }}"
          if [ "$outcome" != "success" ]; then
            echo "::error::examples/stress did not pass for ${{ matrix.store }} ${{ matrix.tier }} (step outcome: ${outcome}); see the job summary and the stress-report-${{ matrix.store }}-${{ matrix.tier }} artifact."
            exit 1
          fi

  # The publishing tiers run after the baseline passes, on main/develop, the
  # schedule and manual dispatch; a PR runs only the baseline job above. The
  # steps come from the same YAML anchor, so the two matrices cannot drift. Each
  # durable store's tiers total 1,000,000 workflows; only the count grows, while
  # workers, store writers and shards stay at the baseline's 4/4/4 because the
  # 4-vCPU runner is already CPU-bound.
  stress-tiers:
    needs: stress
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: sled
            tier: scale
            shards: 4
            workers: 4
            store_workers: 4
            count: 300000
            timeout: 150
          - store: sled
            tier: peak
            shards: 4
            workers: 4
            store_workers: 4
            count: 600000
            timeout: 300
          - store: rocksdb
            tier: scale
            shards: 4
            workers: 4
            store_workers: 4
            count: 300000
            timeout: 150
          - store: rocksdb
            tier: peak
            shards: 4
            workers: 4
            store_workers: 4
            count: 600000
            timeout: 300

    steps: *stress_steps

  # Publishing is the only write in this workflow and lives away from the run,
  # like coverage.yml's badge job. The `stress` branch (not the coverage
  # workflow's `badges` branch) carries one report set and nine SVGs per store,
  # so the two publishing workflows never race on a branch or delete each
  # other's files. A run that failed still publishes a FAIL status badge;
  # keep_files leaves the previous report and metric badges in place so the
  # status never points at a report from the broken run.
  publish:
    needs: [stress, stress-tiers]
    if: >-
      always()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: stress-badges
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download the tiered reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: stress-report-*
          path: target/stress-results

      - name: Render the reports and the badges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          # shellcheck source=badge.sh
          source .github/scripts/badge.sh
          for store in memory sled rocksdb; do
            # A tier that did not finish has no artifact. Publish the largest
            # tier that did, so a skipped or timed-out peak never hides the
            # smaller tiers' report.
            best=""
            best_count=-1
            for candidate in target/stress-results/stress-report-"$store"-*/report.json; do
              [ -f "$candidate" ] || continue
              count="$(jq -r '.config.measured_workflows // 0' "$candidate")"
              if [ "$count" -gt "$best_count" ]; then
                best="$candidate"
                best_count="$count"
              fi
            done
            if [ -n "$best" ]; then
              dir="$(dirname "$best")"
              cp "$dir/report.md" "publish/report-$store.md"
              cp "$best" "publish/report-$store.json"
              cp "$dir/metrics.csv" "publish/metrics-$store.csv"
              cp "$dir/trace.log" "publish/trace-$store.log"
              bash .github/scripts/stress-badge.sh "$best" publish "$store"
            else
              echo "No $store report artifact; publishing a FAIL status badge only."
              render_badge "stress $store" FAIL "#e05d44" 170 "publish/stress-$store.svg"
            fi
          done

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: stress
          publish_dir: ./publish
          keep_files: true
          commit_message: "stress results for ${{ github.ref_name }}@${{ github.sha }}"
