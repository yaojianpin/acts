name: stress

# `examples/stress` under CI.
#
# What this gate asserts is deterministic: every measured workflow completes,
# the error rate is zero, no phase times out, background health never degrades,
# and after the cleanup drain the read model and the durable aggregate family
# are empty. Those are invariants of the engine, not timings — the repo's
# `bench-compile` job explains why a wall-clock threshold would be a random red
# on a shared runner. Throughput and peak RSS are therefore *published* as
# badges and in the report, never gated against a fixed number.
#
# A pull request runs a 1,000-workflow performance smoke at concurrency 16 for
# every store; main/develop, a weekly schedule, and manual dispatch run 100,000
# workflows across 16/32/64/128 for memory, sled and RocksDB with a cleanup
# drain wait, and publish the per-store reports and README badges to the
# `stress` branch. Sled and RocksDB run as four physical shards each.
on:
  pull_request:
    paths:
      - 'crates/acts/src/scheduler/**'
      - 'crates/acts/src/store/**'
      - 'crates/acts-store/**'
      - 'examples/stress/**'
      - '.github/workflows/stress.yml'
      - '.github/scripts/badge.sh'
      - '.github/scripts/stress-badge.sh'
  push:
    branches: ['main', 'develop']
    paths:
      - 'crates/acts/src/scheduler/**'
      - 'crates/acts/src/store/**'
      - 'crates/acts-store/**'
      - 'examples/stress/**'
      - '.github/workflows/stress.yml'
      - '.github/scripts/badge.sh'
      - '.github/scripts/stress-badge.sh'
  schedule:
    # Monday 03:00 UTC — a weekly trend point even on quiet weeks.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: Measured workflows per store
        required: false
        default: '100000'
      concurrency:
        description: Comma-separated concurrency stages
        required: false
        default: '16,32,64,128'
      cleanup_wait_seconds:
        description: Seconds to wait for terminal cleanup after the last phase
        required: false
        default: '300'
      soak_seconds:
        description: Steady-state soak seconds after the ramp (0 disables)
        required: false
        default: '0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STRESS_OUTPUT: target/stress-results

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: memory
            shards: 1
          - store: sled
            shards: 4
          - store: rocksdb
            shards: 4

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Build the stress harness
        run: cargo build --release --locked -p acts-example-stress

      # The event picks the shape: a PR gets the short smoke (a build-sized run
      # that still exercises commit/load/recovery/cleanup for every store),
      # while the publishing legs get the full ramp. Manual inputs win on
      # dispatch.
      - name: Plan the run
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            count=1000
            concurrency=16
            cleanup=120
            soak=0
            label=smoke
          else
            count="${{ inputs.count }}"; count="${count:-100000}"
            concurrency="${{ inputs.concurrency }}"; concurrency="${concurrency:-16,32,64,128}"
            cleanup="${{ inputs.cleanup_wait_seconds }}"; cleanup="${cleanup:-300}"
            soak="${{ inputs.soak_seconds }}"; soak="${soak:-0}"
            label=stress
          fi
          {
            echo "count=${count}"
            echo "concurrency=${concurrency}"
            echo "cleanup_wait_seconds=${cleanup}"
            echo "soak_seconds=${soak}"
            echo "label=${label}"
          } >> "$GITHUB_OUTPUT"

      - name: Run the stress harness
        id: stress
        # The harness exits non-zero on a failed gate; the report and the step
        # summary still have to be produced, so the step itself tolerates the
        # code and the "Enforce" step below fails the job.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          output="$STRESS_OUTPUT/${{ matrix.store }}"
          extra=(--store-shards "${{ matrix.shards }}")
          if [ "${{ matrix.store }}" != "memory" ]; then
            extra+=(--store-url "$STRESS_OUTPUT/${{ matrix.store }}-store")
          fi
          target/release/acts-example-stress \
            --count "${{ steps.plan.outputs.count }}" \
            --concurrency "${{ steps.plan.outputs.concurrency }}" \
            --warmup 100 \
            --soak-seconds "${{ steps.plan.outputs.soak_seconds }}" \
            --cleanup-wait-seconds "${{ steps.plan.outputs.cleanup_wait_seconds }}" \
            --store "${{ matrix.store }}" \
            ${extra[@]+"${extra[@]}"} \
            --output "$output" \
            --sample-ms 1000 \
            --max-error-rate-pct 0
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Summarize the run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$STRESS_OUTPUT/${{ matrix.store }}/report.json"
          if [ ! -f "$report" ]; then
            echo "## Stress (${{ matrix.store }}): no report" >> "$GITHUB_STEP_SUMMARY"
            echo "The harness exited before writing \`report.json\`; see the job log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Stress (${{ steps.plan.outputs.label }}: ${{ matrix.store }})"
            echo
            echo '| metric | value |'
            echo '| --- | --- |'
            jq -r '
              "| Result | \(.status) |",
              "| Completed | \(.total_completed)/\(.total_attempted) |",
              "| Errors / terminated | \(.total_errored) / \(.total_terminated) |",
              "| Throughput | \(.workflows_per_second * 10 | round / 10) workflows/s |",
              "| Peak RSS | \((.max_rss_bytes / 1073741824) * 100 | round / 100) GiB |",
              "| Process rows at the end | \(.final_process_rows) |",
              "| Residual aggregates / indexes | \(.residual_aggregate_documents) / \(.residual_index_documents) |",
              "| Degraded health samples | \(.degraded_health_samples) |",
              "| Elapsed | \(.elapsed_seconds * 10 | round / 10) s |"
            ' "$report"
            echo
            echo "Throughput and RSS are trend data, not a threshold: a shared runner's timings move by double-digit percents between runs. The gate is the invariant rows above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-${{ matrix.store }}
          path: |
            target/stress-results/${{ matrix.store }}/report.md
            target/stress-results/${{ matrix.store }}/report.json
            target/stress-results/${{ matrix.store }}/metrics.csv
            target/stress-results/${{ matrix.store }}/trace.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce the stress result
        if: always()
        shell: bash
        run: |
          outcome="${{ steps.stress.outcome }}"
          if [ "$outcome" != "success" ]; then
            echo "::error::examples/stress reported a failure for ${{ matrix.store }} (step outcome: ${outcome}); see the job summary and the stress-report-${{ matrix.store }} artifact."
            exit 1
          fi

  # Publishing is the only write in this workflow and lives away from the run,
  # like coverage.yml's badge job. The `stress` branch (not the coverage
  # workflow's `badges` branch) carries one report set and four SVGs per store,
  # so the two publishing workflows never race on a branch or delete each
  # other's files. A run that failed still publishes a FAIL status badge;
  # keep_files leaves the previous report and metric badges in place so the
  # status never points at a report from the broken run.
  publish:
    needs: stress
    if: >-
      always()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: stress-badges
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download the memory report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stress-report-memory
          path: target/stress-results/memory

      - name: Download the sled report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stress-report-sled
          path: target/stress-results/sled

      - name: Download the rocksdb report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stress-report-rocksdb
          path: target/stress-results/rocksdb

      - name: Render the reports and the badges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          # shellcheck source=badge.sh
          source .github/scripts/badge.sh
          for store in memory sled rocksdb; do
            dir="target/stress-results/$store"
            report="$dir/report.json"
            if [ -f "$report" ]; then
              cp "$dir/report.md" "publish/report-$store.md"
              cp "$report" "publish/report-$store.json"
              cp "$dir/metrics.csv" "publish/metrics-$store.csv"
              cp "$dir/trace.log" "publish/trace-$store.log"
              bash .github/scripts/stress-badge.sh "$report" publish "$store"
            else
              echo "No $store report artifact; publishing a FAIL status badge only."
              render_badge "stress $store" FAIL "#e05d44" 170 "publish/stress-$store.svg"
            fi
          done

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: stress
          publish_dir: ./publish
          keep_files: true
          commit_message: "stress results for ${{ github.ref_name }}@${{ github.sha }}"
