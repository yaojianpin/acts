name: stress

# `examples/stress` under CI.
#
# What this gate asserts is deterministic: every measured workflow completes,
# the error rate is zero, no phase times out, background health never degrades,
# and after the cleanup drain the read model and the durable aggregate family
# are empty. Those are invariants of the engine, not timings — the repo's
# `bench-compile` job explains why a wall-clock threshold would be a random red
# on a shared runner. Throughput and peak RSS are therefore *published* as
# badges and in the report, never gated against a fixed number.
#
# A pull request runs a 1,000-workflow performance smoke at concurrency 16;
# main/develop, a weekly schedule, and manual dispatch run 5,000 workflows
# across 16/32/64 with a cleanup drain wait, and publish the report and the
# README badges to the `stress` branch.
on:
  pull_request:
    paths:
      - 'crates/acts/src/scheduler/**'
      - 'crates/acts/src/store/**'
      - 'crates/acts-store/**'
      - 'examples/stress/**'
      - '.github/workflows/stress.yml'
      - '.github/scripts/badge.sh'
      - '.github/scripts/stress-badge.sh'
  push:
    branches: ['main', 'develop']
    paths:
      - 'crates/acts/src/scheduler/**'
      - 'crates/acts/src/store/**'
      - 'crates/acts-store/**'
      - 'examples/stress/**'
      - '.github/workflows/stress.yml'
      - '.github/scripts/badge.sh'
      - '.github/scripts/stress-badge.sh'
  schedule:
    # Monday 03:00 UTC — a weekly trend point even on quiet weeks.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: Measured workflows
        required: false
        default: '5000'
      concurrency:
        description: Comma-separated concurrency stages
        required: false
        default: '16,32,64'
      cleanup_wait_seconds:
        description: Seconds to wait for terminal cleanup after the last phase
        required: false
        default: '300'
      soak_seconds:
        description: Steady-state soak seconds after the ramp (0 disables)
        required: false
        default: '0'
      store:
        description: Store backend
        type: choice
        options: [memory, sled, sqlite]
        default: memory

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STRESS_OUTPUT: target/stress-results

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build the stress harness
        run: cargo build --release --locked -p acts-example-stress

      # The event picks the shape: a PR gets the short smoke (a build-sized run
      # that still exercises commit/load/recovery/cleanup), while the publishing
      # legs get the full ramp. Manual inputs win on dispatch.
      - name: Plan the run
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            count=1000
            concurrency=16
            cleanup=120
            soak=0
            store=memory
            label=smoke
          else
            count="${{ inputs.count }}"; count="${count:-5000}"
            concurrency="${{ inputs.concurrency }}"; concurrency="${concurrency:-16,32,64}"
            cleanup="${{ inputs.cleanup_wait_seconds }}"; cleanup="${cleanup:-300}"
            soak="${{ inputs.soak_seconds }}"; soak="${soak:-0}"
            store="${{ inputs.store }}"; store="${store:-memory}"
            label=stress
          fi
          {
            echo "count=${count}"
            echo "concurrency=${concurrency}"
            echo "cleanup_wait_seconds=${cleanup}"
            echo "soak_seconds=${soak}"
            echo "store=${store}"
            echo "label=${label}"
          } >> "$GITHUB_OUTPUT"

      - name: Run the stress harness
        id: stress
        # The harness exits non-zero on a failed gate; the report and the step
        # summary still have to be produced, so the step itself tolerates the
        # code and the "Enforce" step below fails the job.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          extra=()
          if [ "${{ steps.plan.outputs.store }}" = "sled" ]; then
            extra=(--store-url "$STRESS_OUTPUT/sled")
          fi
          target/release/acts-example-stress \
            --count "${{ steps.plan.outputs.count }}" \
            --concurrency "${{ steps.plan.outputs.concurrency }}" \
            --warmup 100 \
            --soak-seconds "${{ steps.plan.outputs.soak_seconds }}" \
            --cleanup-wait-seconds "${{ steps.plan.outputs.cleanup_wait_seconds }}" \
            --store "${{ steps.plan.outputs.store }}" \
            ${extra[@]+"${extra[@]}"} \
            --output "$STRESS_OUTPUT" \
            --sample-ms 1000 \
            --max-error-rate-pct 0
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Summarize the run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$STRESS_OUTPUT/report.json" ]; then
            echo "## Stress: no report" >> "$GITHUB_STEP_SUMMARY"
            echo "The harness exited before writing \`report.json\`; see the job log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Stress (${{ steps.plan.outputs.label }}: ${{ steps.plan.outputs.store }})"
            echo
            echo '| metric | value |'
            echo '| --- | --- |'
            jq -r '
              "| Result | \(.status) |",
              "| Completed | \(.total_completed)/\(.total_attempted) |",
              "| Errors / terminated | \(.total_errored) / \(.total_terminated) |",
              "| Throughput | \(.workflows_per_second * 10 | round / 10) workflows/s |",
              "| Peak RSS | \((.max_rss_bytes / 1073741824) * 100 | round / 100) GiB |",
              "| Process rows at the end | \(.final_process_rows) |",
              "| Residual aggregates / indexes | \(.residual_aggregate_documents) / \(.residual_index_documents) |",
              "| Degraded health samples | \(.degraded_health_samples) |",
              "| Elapsed | \(.elapsed_seconds * 10 | round / 10) s |"
            ' "$STRESS_OUTPUT/report.json"
            echo
            echo "Throughput and RSS are trend data, not a threshold: a shared runner's timings move by double-digit percents between runs. The gate is the invariant rows above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report
          path: |
            target/stress-results/report.md
            target/stress-results/report.json
            target/stress-results/metrics.csv
            target/stress-results/trace.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce the stress result
        if: always()
        shell: bash
        run: |
          outcome="${{ steps.stress.outcome }}"
          if [ "$outcome" != "success" ]; then
            echo "::error::examples/stress reported a failure (step outcome: ${outcome}); see the job summary and the stress-report artifact."
            exit 1
          fi

  # Publishing is the only write in this workflow and lives away from the run,
  # like coverage.yml's badge job. The `stress` branch (not the coverage
  # workflow's `badges` branch) carries the report and the four SVGs the README
  # reads, so the two publishing workflows never race on a branch or delete
  # each other's files. A run that failed still publishes a FAIL status badge;
  # keep_files leaves the previous report and metric badges in place so the
  # status never points at a report from the broken run.
  publish:
    needs: stress
    if: >-
      always()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: stress-badges
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stress-report
          path: target/stress-results

      - name: Render the report and the badges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          if [ -f target/stress-results/report.json ]; then
            cp target/stress-results/report.md publish/report.md
            cp target/stress-results/report.json publish/report.json
            bash .github/scripts/stress-badge.sh target/stress-results/report.json publish
          else
            echo "No report artifact; publishing a FAIL status badge only."
            cat > publish/stress.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="130" height="20" role="img" aria-label="stress: FAIL">
            <title>stress: FAIL</title>
            <defs>
              <clipPath id="round"><rect width="130" height="20" rx="3" fill="#fff"/></clipPath>
              <linearGradient id="shade" x2="0" y2="100%">
                <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
                <stop offset="1" stop-opacity=".1"/>
              </linearGradient>
            </defs>
            <g clip-path="url(#round)">
              <rect width="65" height="20" fill="#555"/>
              <rect x="65" width="65" height="20" fill="#e05d44"/>
              <rect width="130" height="20" fill="url(#shade)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="32.5" y="15" fill="#010101" fill-opacity=".3">stress</text>
              <text x="32.5" y="14">stress</text>
              <text x="97.5" y="15" fill="#010101" fill-opacity=".3">FAIL</text>
              <text x="97.5" y="14">FAIL</text>
            </g>
          </svg>
          SVG
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: stress
          publish_dir: ./publish
          keep_files: true
          commit_message: "stress results for ${{ github.ref_name }}@${{ github.sha }}"
