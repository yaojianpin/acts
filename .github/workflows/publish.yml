name: Publish

on:
  push:
    tags:
      - '*'
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: cargo install cargo-workspaces
      - name: Validate crate metadata (license)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              text=True,
          ))
          missing = [
              p["name"]
              for p in meta["packages"]
              if p.get("publish") != []            # skip publish = false
              and not p.get("license")
              and not p.get("license_file")
          ]
          if missing:
              print("error: publishable crates missing license/license-file: "
                    + ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          print("license check passed")
          PY
      - name: Build
        run: cargo build --workspace --verbose
      - name: Run tests acts
        run: cargo test -p acts --verbose
      - name: Run tests channel
        run: cargo test -p acts-channel --verbose --features=docker_test
      - name: Run tests plugins
        run: cargo test -p acts-plugin-* --verbose
      - name: Run tests packages
        run: cargo test -p acts-package-* --verbose
      - name: Run tests store
        run: cargo test -p acts-store --verbose --features sled,sqlite
      - name: Run tests cli
        run: cargo test -p acts-cli --verbose
      - name: Run tests server
        run: cargo test -p acts-server --verbose
      - name: Run Publish
        run: |
          cp README.md crates/acts/ &&
          cp LICENSE crates/acts/ &&
          sed -i 's|include_str!("../../../README.md")|include_str!("../README.md")|' crates/acts/src/lib.rs &&
          sed -i 's|"../LICENSE", "../README.md"|"LICENSE", "README.md"|' crates/acts/Cargo.toml
          cargo ws publish --publish-as-is --token=${{secrets.CARGO_TOKEN}} --allow-dirty
