name: Publish

on:
  push:
    tags:
      - '*'
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        shell: bash
        run: |
          sudo apt install -y protobuf-compiler
      - name: Install dependency
        run: cargo install cargo-workspaces
      - name: Build
        run: cargo build --workspace --verbose
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Run Publish
        run: |
          cp README.md crates/acts/ &&
          cp LICENSE crates/acts/ &&
          sed -i 's|include_str!("../../../README.md")|include_str!("../README.md")|' crates/acts/src/lib.rs &&
          sed -i 's|"../LICENSE", "../README.md"|"LICENSE", "README.md"|' crates/acts/Cargo.toml
          cargo ws publish --publish-as-is --token=${{secrets.CARGO_TOKEN}} --allow-dirty
