name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            exe: ''
            kind: tar.gz
          - name: macos-x86_64
            os: macos-13
            exe: ''
            kind: tar.gz
          - name: macos-aarch64
            os: macos-latest
            exe: ''
            kind: tar.gz
          - name: windows-x86_64
            os: windows-latest
            exe: .exe
            kind: zip

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build release binaries
        run: cargo build --release -p acts-server -p acts-cli

      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/staging
          cp "target/release/acts-server${{ matrix.exe }}" "dist/staging/acts-server${{ matrix.exe }}"
          cp "target/release/acts-cli${{ matrix.exe }}" "dist/staging/acts-cli${{ matrix.exe }}"
          echo "version=${version}" >> "$GITHUB_ENV"

      - name: Package archive (tar.gz)
        if: matrix.kind == 'tar.gz'
        shell: bash
        run: tar -czf "dist/acts-${version}-${{ matrix.name }}.tar.gz" -C dist/staging .

      - name: Package archive (zip)
        if: matrix.kind == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/staging/* -DestinationPath "dist/acts-$env:version-${{ matrix.name }}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/acts-*
          if-no-files-found: error

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/acts-*
          generate_release_notes: true
