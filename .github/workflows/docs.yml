name: Document

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build Chinese docs
        working-directory: doc
        run: mdbook build

      - name: Build English docs
        working-directory: doc
        run: |
          MDBOOK_BOOK__SRC="src-en" \
          MDBOOK_BOOK__LANGUAGE="en" \
          MDBOOK_BOOK__TITLE="acts Workflow Engine Guide" \
          MDBOOK_BUILD__BUILD_DIR="book/en" \
          mdbook build

      - name: Create language selector
        run: |
          mkdir -p doc/book
          cat > doc/book/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>acts Documentation</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      min-height: 100vh;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                  }
                  .container {
                      text-align: center;
                      background: white;
                      padding: 60px 80px;
                      border-radius: 16px;
                      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                  }
                  h1 {
                      font-size: 2.5em;
                      margin-bottom: 10px;
                      color: #333;
                  }
                  p {
                      color: #666;
                      margin-bottom: 40px;
                      font-size: 1.1em;
                  }
                  .lang-links {
                      display: flex;
                      gap: 30px;
                      justify-content: center;
                  }
                  .lang-link {
                      display: inline-block;
                      padding: 20px 50px;
                      border: 2px solid #667eea;
                      border-radius: 8px;
                      text-decoration: none;
                      color: #667eea;
                      font-size: 1.3em;
                      font-weight: 600;
                      transition: all 0.3s ease;
                  }
                  .lang-link:hover {
                      background: #667eea;
                      color: white;
                      transform: translateY(-2px);
                      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>acts Documentation</h1>
                  <p>Choose your language</p>
                  <div class="lang-links">
                      <a class="lang-link" href="./zh/">中文</a>
                      <a class="lang-link" href="./en/">English</a>
                  </div>
              </div>
          </body>
          </html>
          HTMLEOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "doc/book"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
