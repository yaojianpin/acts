name: test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Install build tools
        shell: bash
        run: |
          sudo apt install -y git g++ cmake ninja-build libssl-dev protobuf-compiler
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run tests channel
        run: cargo test --verbose -p acts-channel --features=docker_test
      - name: Run tests plugins
        run: cargo test --verbose -p acts-plugin-*
      - name: Run tests packages
        run: cargo test --verbose -p acts-package-*
